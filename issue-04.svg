    <rect x="448" y="316" width="150" height="48" rx="14" fill="#eef2f9"/>
    <circle cx="67" cy="340" r="9" fill="#c9d3e6"/>
    <rect x="86" y="332" width="76" height="7" rx="3.5" fill="#c9d3e6"/>
    <rect x="86" y="344" width="53" height="5" rx="2.5" fill="#d7deeb"/>
    <circle cx="270" cy="340" r="9" fill="#1f7fc4"/>
